[env:m5stack-cardputer]
platform = espressif32
board = m5stack-cardputer
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.speed = 921600

; OTA — Spiffs no tamanho certo pra sobrar espaço pro OTA
board_upload.ota.arduino.port = 3232

; Dependencies
lib_deps =
    m5stack/M5Cardputer@^1.1.4
    m5stack/M5GFX@^0.2.0
    ; Audio I2S
    earlephilhower/ESP8266Audio@^1.9.7
    ; HTTP Client
    bblanchon/ArduinoJson@^7.0.0
    ; WiFi Manager
    tzapu/WiFiManager@^2.0.16
    ; Filesystem (SPIFFS for config/images)
    ; I2S mic library (placeholder)
    ; Audio recording (placeholder)

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ESP32_PANIC_PRINT_HALT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; OTA via GitHub (HTTPS)

; Partição com espaço pra OTA
board_build.arduino.partitions = default_16MB.csv

[env:m5stack-cardputer-ota]
platform = espressif32
board = m5stack-cardputer
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.speed = 921600

; OTA upload via rede (após primeira flash via USB)
upload_protocol = espota
upload_port = 192.168.0.200  ; ← ajustar pro IP do seu CardPuter

lib_deps =
    m5stack/M5Cardputer@^1.1.4
    m5stack/M5GFX@^0.2.0
    earlephilhower/ESP8266Audio@^1.9.7
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.16

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ESP32_PANIC_PRINT_HALT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
