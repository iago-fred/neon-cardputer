[platformio]
default_envs = m5stack-cardputer-legacy

; ============================================================
; O env padrao usa esp32-s3-devkitc-1 (compativel com todos)
; Se tiver o board m5stack-cardputer instalado, use:
;   pio run -e m5stack-cardputer
; ============================================================

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-cardputer
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.speed = 921600
board_build.arduino.partitions = default_16MB.csv

; Diretório de código fonte (compatível com Arduino IDE)

; Dependencies
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git
    m5stack/M5GFX@^0.2.0
    earlephilhower/ESP8266Audio@^1.9.7
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ESP32_PANIC_PRINT_HALT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================
; Fallback: usa ESP32-S3 genérico com configuração manual
; Útil se o board m5stack-cardputer não estiver disponível
; ============================================================
[env:m5stack-cardputer-legacy]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.speed = 921600
board_build.arduino.partitions = default_16MB.csv

; Configurações manuais do M5CardPuter
; (USB CDC, PSRAM, LEDs, botões)
board_upload.flash_size = 16MB

; Diretório de código fonte

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git
    m5stack/M5GFX@^0.2.0
    earlephilhower/ESP8266Audio@^1.9.7
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ESP32_PANIC_PRINT_HALT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCONFIG_ESP32_PANIC_PRINT_HALT

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================
; OTA — após primeira gravação USB
; ============================================================
[env:m5stack-cardputer-ota]
platform = espressif32
board = m5stack-cardputer
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.partitions = default_16MB.csv
board_upload.speed = 921600

; OTA upload via rede (ajuste o IP)
upload_protocol = espota
upload_port = 192.168.0.200

; Diretório de código fonte

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git
    m5stack/M5GFX@^0.2.0
    earlephilhower/ESP8266Audio@^1.9.7
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ESP32_PANIC_PRINT_HALT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
